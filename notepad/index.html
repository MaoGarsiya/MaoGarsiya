<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f5f0"><meta name="description" content="Простой блокнот для смартфона">
<title>Блокнот</title>
<style>
:root{color-scheme:light;--bg:#f7f5f0;--card:#fff;--ink:#242424;--muted:#777;--accent:#5c5bd6;--line:#e9e6df}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px system-ui,-apple-system,sans-serif}button,input,textarea{font:inherit}button{cursor:pointer;border:0}.app{max-width:760px;margin:auto;min-height:100dvh;padding:env(safe-area-inset-top) 18px calc(100px + env(safe-area-inset-bottom))}.top{display:flex;align-items:center;justify-content:space-between;padding:22px 0 16px}.top h1{font-size:28px;margin:0;letter-spacing:-1px}.count{color:var(--muted);font-size:13px;margin-top:4px}.search{width:100%;padding:14px 16px;border:1px solid var(--line);border-radius:15px;background:#fff;outline:none;margin-bottom:18px}.search:focus,textarea:focus,input:focus{border-color:var(--accent)}.notes{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:12px}.note{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:16px;text-align:left;min-height:132px;display:flex;flex-direction:column;gap:8px;overflow:hidden}.note h2{font-size:17px;margin:0;overflow-wrap:anywhere}.preview{font-size:14px;color:#656565;white-space:pre-wrap;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}.date{font-size:12px;color:#929292;margin-top:auto;padding-top:8px}.empty{text-align:center;color:var(--muted);padding:55px 10px}.fab{position:fixed;right:max(22px,calc((100vw - 760px)/2 + 22px));bottom:calc(22px + env(safe-area-inset-bottom));width:60px;height:60px;border-radius:22px;background:var(--accent);color:white;font-size:32px;box-shadow:0 8px 25px #5c5bd644}.editor{position:fixed;inset:0;background:var(--bg);z-index:5;display:none;padding:env(safe-area-inset-top) 18px env(safe-area-inset-bottom);overflow:auto}.editor.open{display:block}.editor-inner{max-width:760px;margin:auto;min-height:100%;display:flex;flex-direction:column}.toolbar{display:flex;align-items:center;justify-content:space-between;padding:16px 0;gap:8px}.toolbtn{padding:10px 13px;border-radius:12px;background:#eae8e2;color:var(--ink)}.save{background:var(--accent);color:white}.delete{color:#b42318}.title{border:0;background:transparent;font-size:27px;font-weight:700;outline:none;padding:18px 0 12px;width:100%}textarea{resize:none;flex:1;min-height:55vh;width:100%;border:0;background:transparent;outline:none;line-height:1.65;padding:8px 0 30px}.hint{color:var(--muted);font-size:12px;padding:8px 0 16px}@media(min-width:600px){.app{padding-left:26px;padding-right:26px}.editor{padding-left:26px;padding-right:26px}}
</style>
</head>
<body>
<main class="app">
<header class="top"><div><h1>Мой блокнот</h1><div class="count" id="count">0 заметок</div></div><button class="toolbtn" id="sort" aria-label="Сортировка">По дате ↓</button></header>
<input id="search" class="search" type="search" placeholder="Поиск по заметкам…" aria-label="Поиск по заметкам">
<section id="notes" class="notes" aria-live="polite"></section>
</main>
<button class="fab" id="add" aria-label="Новая заметка">+</button>
<section class="editor" id="editor" aria-label="Редактор заметки">
<div class="editor-inner"><div class="toolbar"><button class="toolbtn" id="back">← Назад</button><div style="display:flex;gap:8px"><button class="toolbtn delete" id="remove">Удалить</button><button class="toolbtn save" id="save">Сохранить</button></div></div>
<input id="title" class="title" maxlength="160" placeholder="Название заметки" aria-label="Название заметки">
<textarea id="body" placeholder="Начните писать…" aria-label="Текст заметки"></textarea><div class="hint">Заметки сохраняются на этом устройстве автоматически при нажатии «Сохранить».</div></div>
</section>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id);const KEY='simple-notepad-v1';
let notes=[],editing=null,sortNewest=true;
try{notes=JSON.parse(localStorage.getItem(KEY)||'[]');if(!Array.isArray(notes))notes=[]}catch{notes=[]}
const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(notes))}catch{alert('Не удалось сохранить. Проверьте свободное место в памяти браузера.')}};
const dateText=v=>new Date(v).toLocaleString('ru-RU',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
function render(){const q=$('search').value.trim().toLowerCase();let shown=notes.filter(n=>(n.title+' '+n.body).toLowerCase().includes(q)).sort((a,b)=>(sortNewest?1:-1)*(b.updated-a.updated));$('count').textContent=notes.length+' '+(notes.length%10===1&&notes.length%100!==11?'заметка':notes.length%10>=2&&notes.length%10<=4&&(notes.length%100<12||notes.length%100>14)?'заметки':'заметок');$('notes').innerHTML='';if(!shown.length){$('notes').innerHTML='<div class="empty">'+(q?'Ничего не найдено':'Пока нет заметок.<br>Нажмите +, чтобы создать первую.')+'</div>';return}for(const n of shown){const b=document.createElement('button');b.className='note';b.type='button';const h=document.createElement('h2');h.textContent=n.title||'Без названия';const p=document.createElement('div');p.className='preview';p.textContent=n.body||'Пустая заметка';const d=document.createElement('div');d.className='date';d.textContent=dateText(n.updated);b.append(h,p,d);b.addEventListener('click',()=>openEditor(n.id));$('notes').append(b)}}
function openEditor(id=null){editing=id;const n=notes.find(x=>x.id===id);$('title').value=n?.title||'';$('body').value=n?.body||'';$('remove').style.display=n?'inline-block':'none';$('editor').classList.add('open');$('title').focus()}
function closeEditor(){const title=$('title').value.trim(),body=$('body').value.trim();if(title||body){const now=Date.now();if(editing){const i=notes.findIndex(n=>n.id===editing);if(i>=0)notes[i]={...notes[i],title,body,updated:now}}else notes.unshift({id:crypto.randomUUID?.()||String(now)+Math.random(),title,body,created:now,updated:now});persist()}$('editor').classList.remove('open');render()}
$('add').addEventListener('click',()=>openEditor());$('back').addEventListener('click',closeEditor);$('save').addEventListener('click',closeEditor);$('search').addEventListener('input',render);$('sort').addEventListener('click',()=>{sortNewest=!sortNewest;$('sort').textContent=sortNewest?'По дате ↓':'По дате ↑';render()});$('remove').addEventListener('click',()=>{if(editing&&confirm('Удалить эту заметку?')){notes=notes.filter(n=>n.id!==editing);persist();$('editor').classList.remove('open');render()}});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('editor').classList.contains('open'))closeEditor()});render();
})();
</script>
</body></html>
