name: Build Android Notepad APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'notepad-android/**'
      - '.github/workflows/build-notepad-android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
        working-directory: notepad-android
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: moy-bloknot-debug-apk
          path: notepad-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
